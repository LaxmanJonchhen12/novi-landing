  <rect width="32" height="32" rx="8" fill="#1e7b9c" />
  <rect x="4" y="4" width="10" height="10" rx="3" fill="#f8f8f5" />
  <rect x="18" y="4" width="10" height="10" rx="3" fill="#f8f8f5" fill-opacity="0.7" />
  <rect x="4" y="18" width="10" height="10" rx="3" fill="#f8f8f5" fill-opacity="0.7" />
  <rect x="18" y="18" width="10" height="10" rx="3" fill="#f8f8f5" />
</svg>
